org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Batch 62 — pangkas waktu compile CI drastis. Tidak ada satupun flag di bawah yang
# mengubah output APK (minify/shrinkResources release TIDAK disentuh — itu risiko ke
# integritas rilis, bukan sekadar waktu compile), murni percepatan proses build:
org.gradle.caching=true
# Build cache: task Gradle (kompilasi Kotlin, dsb) di-cache lintas run kalau input-nya
# sama persis — gradle/actions/setup-gradle@v3 di workflow ikut meng-cache direktori ini
# otomatis (bagian dari ~/.gradle yang sudah ia cache), jadi cache hit di run berikutnya
# tanpa perlu ubah apa pun lagi di workflow.
org.gradle.parallel=true
# Task antar-modul dieksekusi paralel kalau graph-nya memungkinkan. Proyek ini cuma 1
# modul (:app) jadi manfaatnya kecil sekarang, tapi zero-risk dan otomatis berguna
# kalau modul kedua ditambahkan nanti.
org.gradle.configureondemand=true
kotlin.incremental=true
# Batch 76 — lanjutan "pangkas waktu compile sampai habis" (Batch 62). Sama prinsipnya: murni
# proses, TIDAK mengubah output APK.
# - Heap 3072m->4096m + Parallel GC eksplisit: runner ubuntu-latest GitHub Actions py 7GB RAM,
#   3072m ada di ujung bawah rekomendasi umum utk AGP+Compose (sering disarankan 4-6GB) — GC
#   makin sering jalan makin banyak waktu compile "hilang" bukan ke kerja sebenarnya. Parallel GC
#   (bukan default G1) dipilih krn overhead bookkeeping-nya lebih rendah utk proses berumur
#   pendek kayak 1x build CI (G1 dioptimalkan utk aplikasi long-running, bukan use-case ini).
# - Configuration cache: lever TERBESAR yang belum disentuh Batch 62 — men-skip SELURUH fase
#   configuration (parsing build.gradle.kts, evaluasi plugin, resolusi dependency graph) kalau
#   input-nya persis sama dgn run sebelumnya, bukan cuma cache output task (itu domain
#   org.gradle.caching, sudah ada). `problems=warn` sengaja dipasang sbg jaring pengaman: kalau
#   ADA satu bagian build (AGP 8.4.1 + Compose compiler ext 1.5.14 + Kotlin 1.9.24 — kombinasi
#   ini belum pernah diverifikasi config-cache-compatible di environment kerja, TIDAK ada
#   compiler Android tersedia di sini utk mengecek langsung) yang belum kompatibel, Gradle cuma
#   WARN & lanjut build normal (fallback aman), BUKAN gagalkan seluruh CI run — build tetap
#   selamat walau fitur ini ternyata tidak "nyala penuh" utk kombinasi plugin proyek ini.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Release Downloader Spec — WAJIB diisi username/nama-repo GitHub yang benar sebelum fitur
# "Cek Update" di Settings bisa nemu rilis (dipakai app/build.gradle.kts' buildConfigField,
# dibaca UpdateManager.kt saat runtime). Default di bawah cuma placeholder aman.
UPDATE_REPO_OWNER=ganti-username-github
UPDATE_REPO_NAME=AudioPlayer
