name: CI Report

# Batch 543 — JALUR LAPORAN dipisah TOTAL dari workflow "Build APK" (build.yml).
# Alasan (user): build harus HIJAU DULUAN dan tidak berbagi jatah waktu/kompilasi dengan jalur
# ci report; laporan tetap dikelompokkan di AKHIR (1 artifact `ci_report_<run>`).
# Mekanisme: workflow ini TIDAK jalan saat push, melainkan baru dipicu `workflow_run` SETELAH
# "Build APK" SELESAI (sukses atau gagal). Akibatnya: (1) build.yml hanya berisi job `build` ->
# centang hijau commit + APK Release terbit tanpa menunggu emulator/detekt/lint; (2) tak ada
# runner/cache Gradle yang berebut dengan build selagi build berjalan. Konsekuensi yang disadari:
# `ci_report_<run>` terbit LEBIH LAMBAT sebesar durasi build (±2-5 menit) dan artifact-nya kini
# ada di run workflow "CI Report" (bukan di run "Build APK").
# Penomoran: seluruh artifact memakai nomor run "Build APK" (`workflow_run.run_number`) supaya
# `ci_report_<N>` tetap cocok dengan `log_fail_<N>` + tag rilis `-run<N>`.
# Keamanan: dipicu hanya oleh push ke `main` / dispatch manual "Build APK" (tanpa PR fork), jadi
# checkout `head_sha` aman. Token read-only kecuali `collect-reports` (butuh `actions: write`).
on:
  workflow_run:
    workflows: [ "Build APK" ]
    types: [ completed ]
    branches: [ "main" ]

permissions:
  contents: read

env:
  BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
  BUILD_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
  BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
  BUILD_CONCLUSION: ${{ github.event.workflow_run.conclusion }}

jobs:
  # Batch 103 (Gap List #2, Integration/device testing playback) — emulator + `connectedDebugAndroidTest`.
  # Batch 543 — dipindah dari build.yml; kini di workflow terpisah, jadi gagal/flaky/lambat di sini
  # tidak pernah memengaruhi centang hijau build maupun publish APK.
  instrumentation-tests:
    runs-on: ubuntu-latest
    steps:
      # ═══════════════════════ 1. SETUP ═══════════════════════
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          filter: blob:none

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.14.3

      # ═══════════════════════ 2. EMULATOR & TEST ═══════════════════════
      - name: Enable KVM (emulator hardware acceleration)
        # Tanpa ini emulator jalan lewat software rendering murni — jauh lebih lambat, kadang
        # timeout duluan sebelum sempat boot. GitHub-hosted ubuntu-latest runner sudah mendukung
        # KVM sejak beberapa waktu lalu, cuma perlu izin device node-nya dibuka eksplisit di sini.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests
        # Batch 293 hotfix — user upload screenshot GitHub Actions run #287: job ini FAILED,
        # "No compatible devices connected." (dari `instrumentation_test_report_287.zip`, tab
        # Failed tests). Akar masalah: `api-level: 30` di bawah ini sudah 2 batch ketinggalan —
        # Batch 290 bump `minSdk` 23→31 (`app/build.gradle.kts`) tapi TIDAK mengecek job ini.
        # AGP/Gradle test-runner menyaring device yang API-nya DI BAWAH minSdk modul sebelum
        # `connectedDebugAndroidTest` jalan — 1 emulator API 30 yang ada jadi 0 device valid dari
        # sudut pandang module ini (minSdk 31 > API device 30), makanya pesannya "no compatible
        # devices" walau emulatornya sendiri boot sempurna (bukan gagal boot/KVM/dsb).
        # api-level dinaikkan jadi 31 — TEPAT di lantai minSdk baru (bukan asal naik ke
        # 34/targetSdk atau 36/compileSdk): comment asli job ini (Batch 103) sengaja memilih
        # "cukup relevan, tidak melebihi apa yang app-nya sendiri sasar" — minSdk 31 sekarang
        # JADI batas relevan terendah itu, konsisten dgn alasan awal, bukan angka baru sembarang.
        # `gradle` (bukan `./gradlew`) dipakai persis spt job `build` di atas — proyek ini belum
        # menyertakan Gradle Wrapper (gap list item #19, belum digarap), setup-gradle@v3 di atas
        # yang menyediakan binary `gradle` versi 8.7 di PATH utk job ini.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          script: gradle connectedDebugAndroidTest --no-daemon

      - name: Upload instrumentation test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation_test_report_${{ github.event.workflow_run.run_number }}
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 14

  # Batch 525 — static analysis (detekt + lintDebug). Job TERPISAH tanpa `needs:`, pola sama
  # `instrumentation-tests`, publish APK di job `build` tidak pernah ikut terblokir.
  # Batch 531 — FOKUS & NON-BLOCKING: hanya aturan yang temuannya bisa diamati + diperbaiki
  # (config/detekt/detekt.yml + `lint { checkOnly }` di app/build.gradle.kts), `ignoreFailures`
  # detekt = true, lint `abortOnError` = false -> temuan TIDAK membuat job merah; job merah berarti
  # tool-nya sendiri gagal jalan (mis. config detekt salah). Daftar temuan: artifact ci_report_<run>
  # (gabungan sejak Batch 526; laporan ini ada di folder static_analysis_report_<run>/ di dalamnya).
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      # ═══════════════════════ 1. SETUP ═══════════════════════
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          filter: blob:none

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.14.3

      # ═══════════════════════ 2. DETEKT + LINT ═══════════════════════
      - name: Run detekt + lintDebug
        # `gradle` (bukan `./gradlew`) — proyek belum punya Gradle Wrapper (gap list #19),
        # sama seperti job `build` & `instrumentation-tests`.
        # Batch 526 — `--continue`: tanpa ini detekt merah (run #503: 4279 temuan) menghentikan
        # Gradle SEBELUM lintDebug sempat jalan -> laporan lint tidak pernah ada. Dengan flag ini
        # kedua task selalu jalan (sejak Batch 531 temuan tidak lagi menggagalkan task; hanya
        # kegagalan tool/config yang membuat job merah).
        run: gradle detekt lintDebug --no-daemon --console=plain --continue

      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static_analysis_report_${{ github.event.workflow_run.run_number }}
          path: |
            app/build/reports/detekt/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

  # Batch 526 — log failure/laporan CI yang terpisah (log_fail_<run>, instrumentation_test_report_<run>,
  # static_analysis_report_<run>) bikin unduhan menumpuk. Job ini jalan SETELAH kedua job di atas
  # selesai (apa pun hasilnya), menggabungkan semua artifact jadi SATU artifact `ci_report_<run>`
  # (INDEX.txt + 1 folder per laporan asal), lalu menghapus artifact terpisahnya.
  # Batch 543 — `log_fail_<run>` berasal dari run "Build APK" (run lain) -> diunduh lewat `run-id`;
  # artifact terpisah dihapus di KEDUA run. Aman-gagal: artifact terpisah baru dihapus kalau
  # `ci_report_<run>` terbukti sudah terdaftar di run ini; selain itu dibiarkan utuh.
  collect-reports:
    needs: [instrumentation-tests, static-analysis]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write   # DELETE artifact terpisah + download lintas-run; tanpa checkout/contents
    steps:
      - name: Download artifact jalur laporan (run ini)
        # Tanpa `name`/`pattern` = semua artifact run ini, tiap artifact di sub-folder bernama sama.
        # Run tanpa artifact sama sekali tidak boleh membuat job ini merah.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: parts

      - name: Download log build (run Build APK)
        # `log_fail_<N>` hanya ada kalau build gagal; build sukses = tak ada artifact -> boleh kosong.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: parts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Susun laporan gabungan
        run: |
          mkdir -p ci_report parts
          cp -r parts/. ci_report/
          {
            echo "CI REPORT GABUNGAN — run #${BUILD_RUN_NUMBER} — commit ${BUILD_SHA::7}"
            echo "(workflow \"CI Report\" run #${{ github.run_number }}, dipicu selesainya workflow \"Build APK\" run #${BUILD_RUN_NUMBER})"
            echo ""
            echo "Hasil job:"
            echo "  build              : ${BUILD_CONCLUSION}  (workflow Build APK — selesai LEBIH DULU, terpisah dari laporan ini)"
            echo "  instrumentation    : ${{ needs.instrumentation-tests.result }}"
            echo "  static-analysis    : ${{ needs.static-analysis.result }}"
            echo ""
            echo "Isi (1 folder per laporan asal):"
            for d in ci_report/*/; do
              if [ -d "$d" ]; then
                echo "  ${d#ci_report/} — $(find "$d" -type f | wc -l) file"
              fi
            done
            DETEKT_XML=$(find ci_report -name detekt.xml | head -n 1)
            if [ -n "$DETEKT_XML" ]; then
              echo ""
              echo "detekt: $(grep -c '<error ' "$DETEKT_XML" || true) temuan di $(grep -c '<file ' "$DETEKT_XML" || true) file. 15 rule teratas:"
              grep -o 'source="detekt\.[^"]*"' "$DETEKT_XML" | sort | uniq -c | sort -rn | head -n 15 | sed 's/source="detekt\./  /; s/"$//'
            fi
            LINT_XML=$(find ci_report -name lint-results-debug.xml | head -n 1)
            echo ""
            if [ -n "$LINT_XML" ]; then
              echo "lint: $(grep -cE '^[[:space:]]*<issue([[:space:]]|$)' "$LINT_XML" || true) issue (lint-results-debug.xml)"
            else
              echo "lint: lint-results-debug.xml TIDAK ada (lintDebug tidak sampai jalan / tidak menulis laporan)"
            fi
          } > ci_report/INDEX.txt
          cat ci_report/INDEX.txt

      - name: Ukur durasi job + step (INDEX.txt)
        # Batch 540/541 — pengukuran TERPISAH: (A) WAKTU BUILD NYATA = job `build` (jalur APK rilis),
        # (B) JALUR LAPORAN = instrumentation-tests + static-analysis. Tak pernah dijumlahkan.
        # Batch 543 — kedua kelompok kini berada di DUA run berbeda: job `build` dibaca dari run
        # "Build APK" (BUILD_RUN_ID), job laporan dari run ini. Tambahan: jeda build selesai ->
        # laporan mulai (biaya pemisahan yang disadari). python3 bawaan ubuntu-latest, tanpa jq.
        # Aditif + aman-gagal (continue-on-error): kalau API/skrip gagal, laporan lain tetap terbit utuh.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${BUILD_RUN_ID}/jobs?per_page=100" > jobs_build.json
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" > jobs_report.json
          python3 - <<'PY' >> ci_report/INDEX.txt
          import json
          from datetime import datetime

          GRADLE_STEP = "Test + Build Release APK"
          RELEASE_STEP = "Create GitHub Release with signed APK"

          def ts(x):
              return datetime.fromisoformat(x.replace("Z", "+00:00"))

          def secs(a, b):
              return int((ts(b) - ts(a)).total_seconds())

          def done(x):
              return bool(x.get("started_at") and x.get("completed_at"))

          def top_steps(j, n):
              steps = [(secs(s["started_at"], s["completed_at"]), s["name"]) for s in j.get("steps", []) if done(s)]
              for dur, name in sorted(steps, reverse=True)[:n]:
                  print(f"      {dur}s  {name}")

          build = [j for j in json.load(open("jobs_build.json"))["jobs"] if j["name"] == "build"]
          report = [j for j in json.load(open("jobs_report.json"))["jobs"] if j["name"] != "collect-reports" and done(j)]

          print("")
          print("WAKTU BUILD NYATA (jalur APK rilis = job `build` di workflow Build APK; detik, dari GitHub Actions API):")
          if not build or not done(build[0]):
              print("  (job build belum selesai / tidak ada)")
          else:
              j = build[0]
              total = secs(j["started_at"], j["completed_at"])
              print(f"  job build: {j['conclusion']} - {total}s")
              g = [s for s in j.get("steps", []) if s["name"] == GRADLE_STEP and done(s)]
              if g:
                  gs = secs(g[0]["started_at"], g[0]["completed_at"])
                  print(f"    Gradle (tes unit + kompilasi + R8 + paket APK): {gs}s  [step \"{GRADLE_STEP}\"]")
                  print(f"    di luar Gradle (setup, versi, release, post): {total - gs}s")
              else:
                  print(f"    step \"{GRADLE_STEP}\" tidak selesai (gagal / dilewati)")
              r = [s for s in j.get("steps", []) if s["name"] == RELEASE_STEP and done(s) and s.get("conclusion") == "success"]
              if r:
                  print(f"    APK terbit di Release: {secs(j['started_at'], r[0]['completed_at'])}s sejak job mulai")
              else:
                  print("    APK TIDAK terbit di Release (step release tidak sukses)")
              print("    step terlama:")
              top_steps(j, 5)

          print("")
          print("JALUR LAPORAN (workflow CI Report, dimulai SETELAH build selesai; BUKAN waktu build, tak memengaruhi APK):")
          if not report:
              print("  (belum ada job laporan selesai)")
          else:
              if build and done(build[0]):
                  gap = secs(build[0]["completed_at"], min(j["started_at"] for j in report))
                  print(f"  jeda build selesai -> job laporan pertama mulai: {gap}s")
              for j in report:
                  print(f"  {j['name']}: {j['conclusion']} - {secs(j['started_at'], j['completed_at'])}s")
                  top_steps(j, 3)
              first = min(j["started_at"] for j in report)
              last = max(j["completed_at"] for j in report)
              slow = max(report, key=lambda j: secs(j["started_at"], j["completed_at"]))
              print(f"  job laporan terlama = penentu waktu ci_report: {slow['name']} ({secs(slow['started_at'], slow['completed_at'])}s; "
                    f"rentang job laporan {secs(first, last)}s; collect-reports belum dihitung)")
          PY
          tail -n 34 ci_report/INDEX.txt

      - name: Upload laporan gabungan
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ci_report_${{ github.event.workflow_run.run_number }}
          path: ci_report/
          if-no-files-found: error
          retention-days: 14

      - name: Hapus artifact terpisah (sudah termuat di ci_report)
        # Default `if: success()` -> terlewati otomatis kalau upload di atas gagal, jadi artifact
        # terpisah tidak pernah terhapus tanpa pengganti. Dua run dibersihkan: run ini (instrumentation +
        # static analysis) dan run "Build APK" (log_fail).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LISTING=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" --jq '.artifacts[] | "\(.id) \(.name)"')
          if ! echo "$LISTING" | grep -q " ci_report_${BUILD_RUN_NUMBER}$"; then
            echo "ci_report_${BUILD_RUN_NUMBER} belum terdaftar -> artifact terpisah DIPERTAHANKAN"
            exit 0
          fi
          for RUN in "${{ github.run_id }}" "${BUILD_RUN_ID}"; do
            gh api "repos/${{ github.repository }}/actions/runs/${RUN}/artifacts?per_page=100" --jq '.artifacts[] | "\(.id) \(.name)"' | while read -r ID NAME; do
              case "$NAME" in
                log_fail_*|instrumentation_test_report_*|static_analysis_report_*)
                  if gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$ID"; then
                    echo "dihapus: $NAME (run $RUN)"
                  else
                    echo "gagal hapus: $NAME (run $RUN, dibiarkan)"
                  fi
                  ;;
              esac
            done || true
          done
