name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, not a shallow clone — the version scheme below counts total
          # commits, and a shallow checkout would silently under-count that.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Decode signing keystore
        run: echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/app/release.keystore

      - name: Report signing status
        run: |
          if [ -s "${{ github.workspace }}/app/release.keystore" ]; then
            echo "✅ Stable release keystore decoded ($(wc -c < "${{ github.workspace }}/app/release.keystore") bytes) — build will use it."
          else
            echo "⚠️ No keystore decoded (SIGNING_KEYSTORE_BASE64 secret missing/empty) — falling back to debug signing."
          fi

      - name: Determine version name
        id: version
        run: |
          COUNT=$(git rev-list --count HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "name=1.0.$COUNT" >> "$GITHUB_OUTPUT"
          echo "tag=v1.0.$COUNT-release" >> "$GITHUB_OUTPUT"
          echo "Resolved version: 1.0.$COUNT (commit $SHORT_SHA)"

      - name: Build Release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ github.workspace }}/app/release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Rename APK to match version
        run: |
          mkdir -p renamed
          cp app/build/outputs/apk/release/app-release.apk "renamed/AudioPlayer-${{ steps.version.outputs.tag }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          # upload-artifact zips this folder using `name:` as the zip's own file name too,
          # so both the APK inside and the zip GitHub hands back carry the same version tag.
          name: AudioPlayer-${{ steps.version.outputs.tag }}
          path: renamed/AudioPlayer-${{ steps.version.outputs.tag }}.apk
