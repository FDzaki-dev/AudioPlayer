name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Wajib: GITHUB_TOKEN bawaan cuma read-only ke contents secara default — action
    # pembuat Release di bawah butuh izin tulis buat bikin tag + release + upload asset.
    permissions:
      contents: write
    steps:
      # ═══════════════════════ 1. SETUP ═══════════════════════
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, not a shallow clone — the version scheme below counts total
          # commits, and a shallow checkout would silently under-count that.
          fetch-depth: 0
          # Batch 62 — partial clone (blob:none): commit graph/metadata masih lengkap
          # (jadi git rev-list --count di bawah tetap akurat), tapi isi file historis lama
          # TIDAK ikut didownload di awal — cuma di-fetch on-demand kalau ada yang benar-
          # benar butuh isinya. Checkout tetap dapat semua file di HEAD (yang dipakai
          # build) seperti biasa. Ini murni memangkas waktu clone, bukan mengurangi data
          # yang tersedia buat langkah manapun di bawah.
          filter: blob:none

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.14.3
          # Batch 62 — cache Gradle User Home (dependency jar, wrapper dist, dan build
          # cache dari org.gradle.caching=true di gradle.properties) otomatis tersimpan
          # antar-run lewat actions/cache di balik layar action ini. Tidak perlu setup
          # actions/cache manual terpisah — action ini sudah menanganinya sejak v3.

      # Batch 540 — step `actions/cache` untuk `.gradle/configuration-cache` (Batch 76) DIHAPUS bersama
      # `--configuration-cache` + `org.gradle.configuration-cache` (gradle.properties). Alasan: (1) dokumentasi
      # setup-gradle: data configuration-cache bisa memuat secret, jadi hanya di-cache bila dienkripsi
      # (`cache-encryption-key`); step lama menyimpannya TANPA enkripsi dan job ini membawa SIGNING_*.
      # (2) Manfaatnya tak pernah terbukti: tak ada catatan "Reusing configuration cache" di CHANGELOG, dan
      # `gitCommitCount()` (app/build.gradle.kts) memanggil `git rev-list` saat configuration (Batch 528:
      # peringatan CC) -> input yang berubah tiap push. Balik: pulihkan step + flag dari Batch 76.

      - name: Decode signing keystore
        run: echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/app/release.keystore

      - name: Report signing status
        run: |
          if [ -s "${{ github.workspace }}/app/release.keystore" ]; then
            echo "✅ Stable release keystore decoded ($(wc -c < "${{ github.workspace }}/app/release.keystore") bytes) — build will use it."
          else
            echo "⚠️ No keystore decoded (SIGNING_KEYSTORE_BASE64 secret missing/empty) — falling back to debug signing."
          fi

      # ═══════════════════════ 2. VERSIONING ═══════════════════════
      - name: Determine version name
        id: version
        run: |
          # Batch 56: same "count since v-reset tag, fallback to full history" scheme as
          # app/build.gradle.kts' gitCommitCount() — must stay identical or the CI-tagged
          # release name would drift from the number baked into the APK itself.
          #
          # Batch 86 — MAJOR.MINOR.PATCH formula updated to match app/build.gradle.kts'
          # appVersionName exactly (was hardcoded "1.0.$COUNT" here, same "frozen prefix"
          # issue described in that file's Batch 86 comment). VERSION_MAJOR/COMMITS_PER_MINOR
          # below are NOT independently configurable — they exist only to keep this bash copy
          # readable; if you ever tune commitsPerMinor in build.gradle.kts, this 50 must change
          # to match or the tag name and the APK's own versionName will drift apart again.
          COUNT=$(git rev-list --count v-reset..HEAD 2>/dev/null || git rev-list --count HEAD)
          VERSION_MAJOR=1
          COMMITS_PER_MINOR=50
          MINOR=$((COUNT / COMMITS_PER_MINOR))
          PATCH=$((COUNT % COMMITS_PER_MINOR))
          VERSION_NAME="$VERSION_MAJOR.$MINOR.$PATCH"
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          # run_number ditempel di TAG (bukan di appVersionName APK itu sendiri — itu tetap
          # murni dari COUNT, lihat gitCommitCount() di app/build.gradle.kts) supaya re-run
          # manual pada commit yang sama tidak pernah menghasilkan tag/nama file identik
          # dengan rilis sebelumnya (dulu nama file APK bentrok -> hasil unduhan di HP jadi
          # duplikat "(1).apk" alih-alih dikenali sebagai build baru, lihat Batch 65).
          #
          # "-release" dulu ada di antara versi & run number (v1.0.47-release-run159) —
          # dihapus atas permintaan user: run number sendiri sudah cukup bikin tag unik per
          # run, kata "release" di tengah tidak menambah informasi apa pun.
          echo "tag=v$VERSION_NAME-run${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          # Nama TAMPILAN rilis (judul yang muncul di daftar Releases repo) SENGAJA dipisah
          # dari tag di atas — tag wajib unik per run (alasan sama seperti komentar di atas),
          # tapi judul yang dilihat user tidak perlu ikut menampilkan run number itu; cukup
          # nomor versi polos, identik dengan yang tampil di Settings app
          # ("AudioPlayer versi $VERSION_NAME"). Dua output terpisah, TAPI keduanya diturunkan
          # dari $VERSION_NAME yang SAMA di baris ini — tetap sinkron dengan APK
          # (app/build.gradle.kts' gitCommitCount() menghitung commit yang sama persis),
          # cuma beda representasi (unik-untuk-tag vs minimalis-untuk-tampilan).
          echo "release_name=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION_NAME (commit $SHORT_SHA, run ${{ github.run_number }})"

      # ═══════════════════════ 3. BUILD & TEST ═══════════════════════
      - name: Test + Build Release APK
        # Batch 62 — dulu 2 invocation Gradle terpisah (testDebugUnitTest, lalu
        # assembleRelease di step lain) = 2x fase configuration project penuh (parsing
        # build.gradle.kts, resolusi dependency graph, setup plugin Compose compiler,
        # dst) — salah satu biaya tetap terbesar per run Gradle, terlepas dari cache.
        # Digabung jadi 1 invocation: `gradle testDebugUnitTest assembleRelease` bikin
        # Gradle configure project SEKALI utk kedua task, bukan dua kali.
        # Fail-fast tetap terjaga tanpa flag tambahan apa pun: default Gradle behavior
        # (tanpa --continue) langsung stop begitu testDebugUnitTest gagal — assembleRelease
        # dalam invocation yang sama TIDAK akan pernah mulai jalan, persis seperti
        # perilaku 2-step yang lama, cuma tanpa overhead configuration ganda.
        # Urutan step di workflow ini sudah disusun ulang supaya keystore decode +
        # version determination (keduanya tidak butuh Gradle sama sekali) selesai LEBIH
        # DULU sebelum satu-satunya invocation Gradle ini, jadi env var SIGNING_* di bawah
        # sudah siap sejak awal invocation seperti sebelumnya.
        # Batch 540 — `testDebugUnitTest` -> `testReleaseUnitTest`: tes unit JVM murni dijalankan
        # terhadap kelas varian RELEASE yang SAMA dengan yang dikompilasi `assembleRelease`, jadi varian
        # debug (KSP debug + kompilasi Kotlin debug + resource debug) tidak lagi dikompilasi di job ini
        # (job `instrumentation-tests` tetap menyusun varian debug). Tes tak bergantung ke BuildConfig/
        # varian (cek: app/src/test hanya menyebut Robolectric di komentar) dan tes unit TIDAK lewat R8.
        # `--configuration-cache` dihapus (lihat catatan di atas step Decode signing keystore).
        env:
          SIGNING_KEYSTORE_PATH: ${{ github.workspace }}/app/release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle testReleaseUnitTest assembleRelease --no-daemon --build-cache 2>&1 | tee build-output.log

      # ═══════════════════════ 4. PACKAGE & RELEASE ═══════════════════════
      - name: Rename APK to match version
        run: |
          mkdir -p renamed
          cp app/build/outputs/apk/release/app-release.apk "renamed/AudioPlayer-${{ steps.version.outputs.tag }}.apk"

      - name: Capture commit message for release notes
        # Batch 156 — user minta pesan commit (sejak Batch 155 wajib berisi penjelasan fitur
        # singkat, bukan cuma angka versi — lihat PROJECT_STATE.md § "Aturan sesi") juga muncul
        # di app sendiri lewat layar "Cek Update" (UpdateCheckSheet.kt), bukan cuma di chat/
        # CHANGELOG. Ditulis ke FILE (bukan $GITHUB_OUTPUT) karena pesan commit multi-baris —
        # GITHUB_OUTPUT butuh delimiter heredoc yang rawan kalau isi pesan kebetulan memuat
        # baris sama persis dengan delimiter itu; body_path (step release di bawah) baca file
        # apa adanya, tidak kena masalah itu sama sekali.
        #
        # Batch 277 — user bandingkan halaman Release (screenshot) vs Build Summary baru
        # (Batch 276) yang jauh lebih informatif, minta disamakan standarnya. FILE INI PUNYA
        # 2 KONSUMEN SEKALIGUS: (1) halaman web GitHub Release, RENDER Markdown penuh; (2)
        # `UpdateCheckSheet.kt` di app, `Text()` POLOS — TIDAK render Markdown, sintaks `##`/
        # tabel/`**` bakal tampil MENTAH sebagai karakter literal, bikin rusak di app. Jadi
        # baris tambahan di bawah SENGAJA plain text aja (bukan header/tabel Markdown spt
        # Build Summary yang cuma dibaca CI), aman di KEDUA konsumen — tetap nambah info versi
        # + commit SHA singkat yang sebelumnya cuma ada di elemen UI terpisah GitHub (tidak
        # ikut ke body), tanpa risiko syntax mentah muncul di UI app.
        run: |
          {
            echo "${{ steps.version.outputs.tag }} ($(git rev-parse --short HEAD))"
            echo ""
            git log -1 --pretty=%B
          } > release_notes.txt

      - name: Create GitHub Release with signed APK
        # softprops/action-gh-release menempel file APK langsung sebagai release asset —
        # BUKAN CI artifact. Release asset di-serve GitHub apa adanya (tidak dibungkus .zip
        # otomatis seperti actions/upload-artifact), dan permanen/publik-diunduh tanpa login,
        # sesuai aturan: APK signed harus jadi asset rilis GitHub, dilarang dibungkus .zip.
        #
        # tag_name pakai `tag` (unik per run, wajib beda tiap kali — lihat komentar step
        # "Determine version name" di atas), name pakai `release_name` (minimalis, cuma
        # nomor versi) — sengaja BEDA field, supaya daftar Releases di halaman repo tampil
        # rapi ("v1.0.47") sementara git tag di baliknya tetap unik ("v1.0.47-run159").
        # body_path (Batch 156) — isi release_notes.txt (pesan commit HEAD, step di atas) jadi
        # field "body" GitHub Release, dibaca app lewat GitHubReleaseChecker.kt/
        # UpdateCheckSheet.kt di layar "Cek Update".
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.release_name }}
          body_path: release_notes.txt
          files: renamed/AudioPlayer-${{ steps.version.outputs.tag }}.apk

      # ═══════════════════════ 5. DIAGNOSTICS & SUMMARY ═══════════════════════
      - name: Publish build summary
        # Batch 276 — user minta workflow lebih informatif. Sebelum ini, satu-satunya cara
        # tahu versi/commit yang barusan di-build adalah buka log mentah step "Determine
        # version name" satu-satu — halaman ringkasan run GitHub Actions (yang muncul begitu
        # run selesai, sebelum klik ke step manapun) SELALU KOSONG total. Step ini nulis ke
        # $GITHUB_STEP_SUMMARY (fitur native Actions, dirender sebagai Markdown di halaman
        # ringkasan run) — 100% aditif, tidak mengubah build/signing/release APAPUN di atas.
        if: always()
        run: |
          {
            echo "## 🎵 AudioPlayer — Build ${{ steps.version.outputs.tag || 'N/A' }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Versi** | \`${{ steps.version.outputs.tag || 'gagal ditentukan' }}\` |"
            echo "| **Commit** | \`$(git rev-parse --short HEAD)\` |"
            echo "| **Trigger** | ${{ github.event_name }} oleh @${{ github.actor }} |"
            if [ -f release_notes.txt ]; then
              echo "| **Pesan commit** | $(head -1 release_notes.txt) |"
            fi
            if [ -f "renamed/AudioPlayer-${{ steps.version.outputs.tag }}.apk" ]; then
              echo "| **Release** | [Lihat di GitHub Releases](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}) |"
            else
              echo "| **Release** | ⚠️ APK tidak sampai dibuat — cek log step \"Test + Build Release APK\" |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failure log artifact
        # Batch 62 — dulu 2 log file terpisah (test-output.log, build-output.log) karena
        # 2 step Gradle terpisah; sekarang cuma 1 (build-output.log, dari step gabungan di
        # atas) yang isinya sudah mencakup output test maupun build sekaligus (satu
        # invocation, satu stream log berurutan). Path test-output.log dihapus dari daftar
        # supaya tidak tampil "file not found" palsu di setiap kegagalan.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log_fail_${{ github.run_number }}
          path: |
            build-output.log
            app/build/reports/tests/testReleaseUnitTest/
            app/build/test-results/testReleaseUnitTest/
          if-no-files-found: ignore
          retention-days: 14

  # Batch 103 (Gap List #2, Integration/device testing playback) — job TERPISAH dari `build` di
  # atas, sengaja TANPA `needs:` ke arah manapun: kalau emulator di sini gagal/flaky/lambat,
  # publish GitHub Release APK di job `build` tetap jalan normal, tidak pernah ikut terblokir.
  # Trade-off yang disadari: emulator boot + jalankan test menambah beberapa menit total waktu
  # CI di SETIAP push ke main (job ini jalan paralel, bukan nambah durasi job `build`, tapi tetap
  # menambah biaya runner-minutes total) — kalau ini kerasa berat, ubah `on:` job ini sendiri jadi
  # `workflow_dispatch` manual saja; belum dilakukan di batch ini krn gap list secara eksplisit
  # minta instrumentation test benar-benar tereksekusi (bukan cuma tertulis), bukan cuma opsional.
  instrumentation-tests:
    runs-on: ubuntu-latest
    steps:
      # ═══════════════════════ 1. SETUP ═══════════════════════
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.14.3

      # ═══════════════════════ 2. EMULATOR & TEST ═══════════════════════
      - name: Enable KVM (emulator hardware acceleration)
        # Tanpa ini emulator jalan lewat software rendering murni — jauh lebih lambat, kadang
        # timeout duluan sebelum sempat boot. GitHub-hosted ubuntu-latest runner sudah mendukung
        # KVM sejak beberapa waktu lalu, cuma perlu izin device node-nya dibuka eksplisit di sini.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests
        # Batch 293 hotfix — user upload screenshot GitHub Actions run #287: job ini FAILED,
        # "No compatible devices connected." (dari `instrumentation_test_report_287.zip`, tab
        # Failed tests). Akar masalah: `api-level: 30` di bawah ini sudah 2 batch ketinggalan —
        # Batch 290 bump `minSdk` 23→31 (`app/build.gradle.kts`) tapi TIDAK mengecek job ini.
        # AGP/Gradle test-runner menyaring device yang API-nya DI BAWAH minSdk modul sebelum
        # `connectedDebugAndroidTest` jalan — 1 emulator API 30 yang ada jadi 0 device valid dari
        # sudut pandang module ini (minSdk 31 > API device 30), makanya pesannya "no compatible
        # devices" walau emulatornya sendiri boot sempurna (bukan gagal boot/KVM/dsb).
        # api-level dinaikkan jadi 31 — TEPAT di lantai minSdk baru (bukan asal naik ke
        # 34/targetSdk atau 36/compileSdk): comment asli job ini (Batch 103) sengaja memilih
        # "cukup relevan, tidak melebihi apa yang app-nya sendiri sasar" — minSdk 31 sekarang
        # JADI batas relevan terendah itu, konsisten dgn alasan awal, bukan angka baru sembarang.
        # `gradle` (bukan `./gradlew`) dipakai persis spt job `build` di atas — proyek ini belum
        # menyertakan Gradle Wrapper (gap list item #19, belum digarap), setup-gradle@v3 di atas
        # yang menyediakan binary `gradle` versi 8.7 di PATH utk job ini.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          script: gradle connectedDebugAndroidTest --no-daemon

      - name: Upload instrumentation test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation_test_report_${{ github.run_number }}
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 14

  # Batch 525 — static analysis (detekt + lintDebug). Job TERPISAH tanpa `needs:`, pola sama
  # `instrumentation-tests`, publish APK di job `build` tidak pernah ikut terblokir.
  # Batch 531 — FOKUS & NON-BLOCKING: hanya aturan yang temuannya bisa diamati + diperbaiki
  # (config/detekt/detekt.yml + `lint { checkOnly }` di app/build.gradle.kts), `ignoreFailures`
  # detekt = true, lint `abortOnError` = false -> temuan TIDAK membuat job merah; job merah berarti
  # tool-nya sendiri gagal jalan (mis. config detekt salah). Daftar temuan: artifact ci_report_<run>
  # (gabungan sejak Batch 526; laporan ini ada di folder static_analysis_report_<run>/ di dalamnya).
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      # ═══════════════════════ 1. SETUP ═══════════════════════
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.14.3

      # ═══════════════════════ 2. DETEKT + LINT ═══════════════════════
      - name: Run detekt + lintDebug
        # `gradle` (bukan `./gradlew`) — proyek belum punya Gradle Wrapper (gap list #19),
        # sama seperti job `build` & `instrumentation-tests`.
        # Batch 526 — `--continue`: tanpa ini detekt merah (run #503: 4279 temuan) menghentikan
        # Gradle SEBELUM lintDebug sempat jalan -> laporan lint tidak pernah ada. Dengan flag ini
        # kedua task selalu jalan (sejak Batch 531 temuan tidak lagi menggagalkan task; hanya
        # kegagalan tool/config yang membuat job merah).
        run: gradle detekt lintDebug --no-daemon --console=plain --continue

      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static_analysis_report_${{ github.run_number }}
          path: |
            app/build/reports/detekt/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

  # Batch 526 — log failure/laporan CI yang terpisah (log_fail_<run>, instrumentation_test_report_<run>,
  # static_analysis_report_<run>) bikin unduhan menumpuk. Job ini jalan SETELAH ketiga job di atas
  # selesai (apa pun hasilnya), menggabungkan semua artifact run ini jadi SATU artifact
  # `ci_report_<run>` (INDEX.txt + 1 folder per laporan asal), lalu menghapus artifact terpisahnya.
  # Murni aditif: `needs:` hanya mengarah dari job ini KE tiga job lain (bukan sebaliknya) ->
  # publish APK di job `build` tidak pernah menunggu/terblokir. Aman-gagal: artifact terpisah baru
  # dihapus kalau `ci_report_<run>` terbukti sudah terdaftar di run ini; selain itu semuanya
  # dibiarkan utuh (fallback = perilaku lama).
  collect-reports:
    needs: [build, instrumentation-tests, static-analysis]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write   # hanya utk DELETE artifact terpisah lewat REST API; tanpa checkout/contents
    steps:
      - name: Download semua artifact run ini
        # Tanpa `name`/`pattern` = semua artifact run ini, tiap artifact di sub-folder bernama
        # sama. Run tanpa artifact sama sekali (semua job gagal sebelum upload) tidak boleh
        # membuat job ini merah.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: parts

      - name: Susun laporan gabungan
        run: |
          mkdir -p ci_report parts
          cp -r parts/. ci_report/
          {
            echo "CI REPORT GABUNGAN — run #${{ github.run_number }} — commit ${GITHUB_SHA::7}"
            echo ""
            echo "Hasil job:"
            echo "  build              : ${{ needs.build.result }}"
            echo "  instrumentation    : ${{ needs.instrumentation-tests.result }}"
            echo "  static-analysis    : ${{ needs.static-analysis.result }}"
            echo ""
            echo "Isi (1 folder per laporan asal):"
            for d in ci_report/*/; do
              if [ -d "$d" ]; then
                echo "  ${d#ci_report/} — $(find "$d" -type f | wc -l) file"
              fi
            done
            DETEKT_XML=$(find ci_report -name detekt.xml | head -n 1)
            if [ -n "$DETEKT_XML" ]; then
              echo ""
              echo "detekt: $(grep -c '<error ' "$DETEKT_XML" || true) temuan di $(grep -c '<file ' "$DETEKT_XML" || true) file. 15 rule teratas:"
              grep -o 'source="detekt\.[^"]*"' "$DETEKT_XML" | sort | uniq -c | sort -rn | head -n 15 | sed 's/source="detekt\./  /; s/"$//'
            fi
            LINT_XML=$(find ci_report -name lint-results-debug.xml | head -n 1)
            echo ""
            if [ -n "$LINT_XML" ]; then
              echo "lint: $(grep -cE '^[[:space:]]*<issue([[:space:]]|$)' "$LINT_XML" || true) issue (lint-results-debug.xml)"
            else
              echo "lint: lint-results-debug.xml TIDAK ada (lintDebug tidak sampai jalan / tidak menulis laporan)"
            fi
          } > ci_report/INDEX.txt
          cat ci_report/INDEX.txt

      - name: Ukur durasi job + step (INDEX.txt)
        # Batch 540 — pemangkasan waktu CI harus TERUKUR, bukan tebakan: durasi tiap job + 5 step terlama
        # per job dari GitHub Actions API ditambahkan ke INDEX.txt (ikut terunggah di ci_report_<run>).
        # python3 (bawaan ubuntu-latest) dipakai, bukan jq: skrip ini bisa dieksekusi + diuji di luar CI.
        # Aditif + aman-gagal (continue-on-error): kalau API/skrip gagal, laporan lama tetap terbit utuh.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" > jobs.json
          python3 - <<'PY' >> ci_report/INDEX.txt
          import json
          from datetime import datetime

          def ts(x):
              return datetime.fromisoformat(x.replace("Z", "+00:00"))

          def secs(a, b):
              return int((ts(b) - ts(a)).total_seconds())

          jobs = [j for j in json.load(open("jobs.json"))["jobs"]
                  if j.get("started_at") and j.get("completed_at") and j["name"] != "collect-reports"]
          print("")
          print("DURASI CI (detik, dari GitHub Actions API; collect-reports sendiri tidak dihitung):")
          if not jobs:
              print("  (belum ada job selesai)")
          else:
              first = min(j["started_at"] for j in jobs)
              last = max(j["completed_at"] for j in jobs)
              print(f"  TOTAL wall-clock job paralel: {secs(first, last)}s")
              for j in jobs:
                  print(f"  {j['name']}: {j['conclusion']} - {secs(j['started_at'], j['completed_at'])}s")
                  steps = [(secs(s["started_at"], s["completed_at"]), s["name"]) for s in j.get("steps", [])
                           if s.get("started_at") and s.get("completed_at")]
                  for dur, name in sorted(steps, reverse=True)[:5]:
                      print(f"      {dur}s  {name}")
          PY
          tail -n 30 ci_report/INDEX.txt

      - name: Upload laporan gabungan
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ci_report_${{ github.run_number }}
          path: ci_report/
          if-no-files-found: error
          retention-days: 14

      - name: Hapus artifact terpisah (sudah termuat di ci_report)
        # Default `if: success()` -> terlewati otomatis kalau upload di atas gagal, jadi artifact
        # terpisah tidak pernah terhapus tanpa pengganti.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LISTING=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" --jq '.artifacts[] | "\(.id) \(.name)"')
          if ! echo "$LISTING" | grep -q " ci_report_${{ github.run_number }}$"; then
            echo "ci_report_${{ github.run_number }} belum terdaftar -> artifact terpisah DIPERTAHANKAN"
            exit 0
          fi
          echo "$LISTING" | while read -r ID NAME; do
            case "$NAME" in
              log_fail_*|instrumentation_test_report_*|static_analysis_report_*)
                if gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$ID"; then
                  echo "dihapus: $NAME"
                else
                  echo "gagal hapus: $NAME (dibiarkan)"
                fi
                ;;
            esac
          done
