name: Android CI Artifact for Claude

# Batch 570 — adaptasi `github-claude-artifact.md` (user) ke SONIX. Menghasilkan SATU berkas teks ringkas
# `laporan-untuk-claude.txt` (ArchUnit + SpotBugs SARIF) sebagai artifact resmi GitHub (upload-artifact@v4).
# Batch 571 — run #1 (commit 316eb57): exit=1, 58s, KEDUA laporan tak terbentuk, akar masalah TIDAK terbaca
# (ekor log = 80 baris stack frame Gradle karena `--stacktrace`). Perbaikan: ArchUnit dan SpotBugs dijalankan di
# 2 invocation Gradle TERPISAH (SpotBugs gagal tak lagi menjatuhkan ArchUnit) dengan log masing-masing, tanpa
# `--stacktrace`, dan laporan memuat kutipan AKAR MASALAH (blok FAILURE/"What went wrong", baris `e:`, task FAILED)
# + ekor log tanpa baris stack frame.
#
# Workflow TERPISAH dari `build.yml` ("Build APK", 1 job, TIDAK diubah): runner sendiri dan berjalan paralel,
# jadi tidak mengambil jatah waktu build/rilis, dan kegagalan di sini TIDAK memengaruhi APK/Release.
# Semua langkah analisis NON-BLOCKING; alat yang tak jalan / laporan yang tak terbentuk dicatat
# `NOT VERIFIED` (alat gagal != lulus) — TIDAK PERNAH "bersih".
#
# Beda dari berkas contoh (alasan):
#  - `gradle` (setup-gradle 8.14.3, sama dgn build.yml) bukan `./gradlew`: proyek belum punya Gradle Wrapper.
#  - Task `spotbugsRelease` TIDAK ada di proyek Android bila plugin `com.github.spotbugs` dipakai langsung;
#    dibuat lewat config/spotbugs/spotbugs.gradle.kts (aktif hanya dgn -Psonix.spotbugs=true).
#  - ArchUnit = tes `ArchitectureTest` (report-only, aktif hanya dgn env SONIX_ARCH_REPORT=1); status dibaca dari
#    laporan tesnya, BUKAN grep nama kelas di log (grep itu memberi "lulus" palsu bila tes tak sempat jalan).
#  - Varian release (bukan debug): kompilasi dipakai bersama (invocation kedua memakai hasil up-to-date).
#  - upload-artifact@v4 (contoh memakai `actions/allowed-actions/upload-artifact`, yang tidak ada).
#  - Pemicu: push `main` + manual (selaras build.yml); `cache-read-only`: cache Gradle hanya ditulis build.yml.

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: android-artifact-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.14.3
          cache-read-only: true

      # 1. Dua invocation Gradle TERPISAH (kegagalan satu tak menjatuhkan yang lain). Exit code disimpan ke
      #    berkas; langkah ini SELALU sukses.
      - name: ArchUnit + SpotBugs (NON-BLOCKING)
        id: analysis
        continue-on-error: true
        timeout-minutes: 30
        env:
          SONIX_ARCH_REPORT: "1"
        run: |
          set +e
          gradle testReleaseUnitTest --tests "com.rudi.audioplayer.ArchitectureTest" --no-daemon --build-cache > gradle-arch.log 2>&1
          echo "ARCH_EXIT=$?" > gradle-exit.txt
          gradle spotbugsRelease -Psonix.spotbugs=true --no-daemon --build-cache > gradle-spotbugs.log 2>&1
          echo "SPOTBUGS_EXIT=$?" >> gradle-exit.txt
          cat gradle-exit.txt
          exit 0

      # 2. Rakit laporan ringkas. Status ArchUnit/SpotBugs HANYA dari berkas laporan yang benar-benar ada.
      - name: Create Compact Report for Claude
        if: always()
        run: |
          set +e
          ARCH=app/build/reports/archunit/archunit-report.txt
          SARIF=app/build/reports/spotbugs/spotbugs.sarif
          ARCH_EXIT=$(sed -n 's/^ARCH_EXIT=//p' gradle-exit.txt 2>/dev/null | head -n 1)
          SPOTBUGS_EXIT=$(sed -n 's/^SPOTBUGS_EXIT=//p' gradle-exit.txt 2>/dev/null | head -n 1)
          ARCH_EXIT=${ARCH_EXIT:-n/a}
          SPOTBUGS_EXIT=${SPOTBUGS_EXIT:-n/a}
          : > report-arch.tmp
          : > report-sarif.tmp

          # Kutipan akar masalah dari log Gradle (tanpa baris stack frame): blok FAILURE/"What went wrong",
          # baris kompilasi `e:`, task FAILED, lalu ekor log.
          excerpt() {
            [ -f "$1" ] || { echo "(log $1 tidak ada)"; return; }
            echo "-- AKAR MASALAH (kutipan $1) --"
            sed -n '/^FAILURE:/,/^\* Try:/p' "$1" | grep -v -E '^\s+at ' | head -n 60
            grep -E '^e: |^> Task .* FAILED|Script compilation error|Could not resolve|Unresolved reference' "$1" | head -n 30
            echo "-- EKOR LOG $1 (40 baris terakhir, tanpa stack frame) --"
            grep -v -E '^\s+at ' "$1" | tail -n 40
          }

          # --- ArchUnit ---
          NEED_ARCH_LOG=0
          if [ -s "$ARCH" ]; then
            A_STATUS=$(sed -n 's/^ARCHUNIT_STATUS=//p' "$ARCH" | head -n 1)
            if [ "$A_STATUS" = "OK" ]; then
              A_VIOL=$(sed -n 's/^VIOLATIONS=//p' "$ARCH" | head -n 1)
              if [ "$A_VIOL" = "0" ]; then
                ARCH_SUMMARY="ArchUnit: LULUS (0 pelanggaran)"
              else
                ARCH_SUMMARY="ArchUnit: ${A_VIOL:-?} PELANGGARAN"
              fi
            else
              ARCH_SUMMARY="ArchUnit: NOT VERIFIED (alat gagal jalan)"
              NEED_ARCH_LOG=1
            fi
            cat "$ARCH" > report-arch.tmp
          else
            ARCH_SUMMARY="ArchUnit: NOT VERIFIED (laporan tidak terbentuk: tes dilewati/gagal; lihat kutipan log)"
            echo "Berkas $ARCH tidak ada." > report-arch.tmp
            NEED_ARCH_LOG=1
          fi
          if [ "$NEED_ARCH_LOG" = "1" ] || [ "$ARCH_EXIT" != "0" ]; then
            { echo ""; excerpt gradle-arch.log; } >> report-arch.tmp
          fi

          # --- SpotBugs (SARIF) ---
          NEED_SB_LOG=0
          if [ -s "$SARIF" ] && jq -e '.runs' "$SARIF" > /dev/null 2>&1 && S_COUNT=$(jq '[.runs[].results[]?] | length' "$SARIF" 2>/dev/null) && [ -n "$S_COUNT" ]; then
            SARIF_SUMMARY="SpotBugs: $S_COUNT temuan"
            {
              echo "Jumlah temuan: $S_COUNT"
              if [ "$S_COUNT" -gt 0 ]; then
                echo ""
                echo "Per aturan (terbanyak dulu):"
                jq -r '[.runs[].results[]?] | group_by(.ruleId) | map({r: .[0].ruleId, n: length}) | sort_by(-.n)[] | "  \(.n)x \(.r)"' "$SARIF" 2>/dev/null | head -n 40
                echo ""
                echo "Temuan (maks 40 pertama):"
                jq -r '[.runs[].results[]?][:40][] | "- \(.ruleId) @ \(.locations[0].physicalLocation.artifactLocation.uri // "?"):\(.locations[0].physicalLocation.region.startLine // 0)\n  \(.message.text)"' "$SARIF" 2>/dev/null
                if [ "$S_COUNT" -gt 40 ]; then
                  echo "... (+$((S_COUNT - 40)) temuan lain disingkat)"
                fi
              fi
            } > report-sarif.tmp
          else
            SARIF_SUMMARY="SpotBugs: NOT VERIFIED (SARIF tidak terbentuk / tidak valid / jq gagal; lihat kutipan log)"
            echo "Berkas $SARIF tidak ada atau tidak bisa dibaca." > report-sarif.tmp
            NEED_SB_LOG=1
          fi
          if [ "$NEED_SB_LOG" = "1" ] || [ "$SPOTBUGS_EXIT" != "0" ]; then
            { echo ""; excerpt gradle-spotbugs.log; } >> report-sarif.tmp
          fi

          {
            echo "=== LAPORAN EVALUASI UNTUK CLAUDE ==="
            echo "Proyek: ${{ github.event.repository.name }} · Commit: ${{ github.sha }} · Run: #${{ github.run_number }} · Cabang: ${{ github.ref_name }}"
            echo "Dibuat (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Gradle: [1] testReleaseUnitTest --tests ArchitectureTest · exit=$ARCH_EXIT | [2] spotbugsRelease -Psonix.spotbugs=true · exit=$SPOTBUGS_EXIT"
            echo ""
            echo "--- RINGKASAN ---"
            echo "$ARCH_SUMMARY"
            echo "$SARIF_SUMMARY"
            echo "Catatan: NOT VERIFIED = alat tidak jalan / laporan tidak ada; BUKAN berarti bersih."
            echo ""
            echo "--- ARSITEKTUR (ARCHUNIT) ---"
            cat report-arch.tmp
            echo ""
            echo "--- KUALITAS KODE (SPOTBUGS · SARIF) ---"
            cat report-sarif.tmp
          } > laporan-untuk-claude.txt

          echo "::notice::$ARCH_SUMMARY · $SARIF_SUMMARY"
          {
            echo "### 🔎 Laporan untuk Claude (non-blocking)"
            echo ""
            echo "- $ARCH_SUMMARY"
            echo "- $SARIF_SUMMARY"
            echo "- Artifact: \`SONIX_laporan-untuk-claude_run${{ github.run_number }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          cat laporan-untuk-claude.txt

      # 3. Artifact resmi GitHub (berkas tunggal .txt; mudah diunduh di HP lalu diunggah ke Claude).
      - name: Upload Report for Claude
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SONIX_laporan-untuk-claude_run${{ github.run_number }}
          path: laporan-untuk-claude.txt
          retention-days: 14
          if-no-files-found: warn
