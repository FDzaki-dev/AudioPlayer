name: Android CI Artifact for Claude

# Batch 570 — adaptasi `github-claude-artifact.md` (user) ke SONIX. Menghasilkan SATU berkas teks ringkas
# `laporan-untuk-claude.txt` sebagai artifact resmi GitHub (upload-artifact@v4).
# Batch 575 — static analysis (detekt + lintDebug) DIPINDAH dari `build.yml` ke sini (permintaan user: "pisahkan
# static analysis, gabungkan ke pathway laporan untuk Claude, biar ringkas"): artifact `SONIX_static_analysis_...`
# TIDAK ada lagi; hasilnya masuk laporan yang sama. Laporan dipadatkan: ArchUnit hanya baris ringkas bila lulus,
# temuan SpotBugs 1 baris per titik (duplikat digabung "xN"), detekt/lint hanya diurai bila ada temuan.
# Batch 576 — peringatan kompilator Kotlin (`w: file://...`, mis. API deprecated / "Condition is always 'true'") ditambahkan
# ke laporan (permintaan user: "Tambahkan"). Diambil dari log kompilasi release (invocation 1) + debug (invocation 3),
# dedupe, tanpa kode tes. Kedua invocation itu memakai `--no-build-cache`: tugas kompilasi yang diambil dari cache
# TIDAK mencetak peringatan -> tanpa ini 0 peringatan bisa berarti "dari cache", bukan "bersih". Bila tak ada tugas
# kompilasi Kotlin yang benar-benar dieksekusi -> `NOT VERIFIED`.
# Batch 571 — ArchUnit dan SpotBugs di invocation Gradle TERPISAH (satu gagal tak menjatuhkan yang lain), tanpa
# `--stacktrace`; alat NOT VERIFIED / exit != 0 -> laporan memuat kutipan AKAR MASALAH + ekor log tanpa stack frame.
# Batch 574 — noise Kotlin SpotBugs disaring di sumber (config/spotbugs/exclude.xml).
#
# Batch 645 — banner "Laporan untuk Claude" di halaman ringkasan run: (a) ditambah baris "Tes unit" (jumlah tes / gagal / dilewati dari
# XML hasil tes; kompilasi tes gagal = NOT VERIFIED + kutipan `e:`), (b) banner kini ditulis ke `banner.md` lalu DIPUBLIKASI oleh langkah
# tersendiri `if: always()` — bila langkah rakit laporan gagal di tengah, banner cadangan (NOT VERIFIED) tetap tampil. `detekt typed`
# (detektDebug) SENGAJA tak ditambahkan: classpath detekt 1.23.8 (compiler Kotlin 2.0.21) tak cocok dgn Kotlin 2.4.10 proyek
# (lihat app/build.gradle.kts), jadi hasilnya pasti NOT VERIFIED/derau.
#
# Workflow TERPISAH dari `build.yml` ("Build APK", 1 job, kini hanya build + tes + Release + artifact APK): runner
# sendiri dan berjalan paralel, jadi tidak mengambil jatah waktu build/rilis, dan kegagalan di sini TIDAK memengaruhi
# APK/Release. Semua langkah analisis NON-BLOCKING; alat yang tak jalan / laporan yang tak terbentuk dicatat
# `NOT VERIFIED` (alat gagal != lulus) — TIDAK PERNAH "bersih".
#
# Beda dari berkas contoh (alasan):
#  - `gradle` (setup-gradle 8.14.4, sama dgn build.yml) bukan `./gradlew`: proyek belum punya Gradle Wrapper.
#  - Task `spotbugsRelease` TIDAK ada di proyek Android bila plugin `com.github.spotbugs` dipakai langsung;
#    dibuat lewat config/spotbugs/spotbugs.gradle.kts (aktif hanya dgn -Psonix.spotbugs=true).
#  - ArchUnit = tes `ArchitectureTest` (report-only, aktif hanya dgn env SONIX_ARCH_REPORT=1); status dibaca dari
#    laporan tesnya, BUKAN grep nama kelas di log (grep itu memberi "lulus" palsu bila tes tak sempat jalan).
#  - ArchUnit + SpotBugs memakai varian release; detekt + lintDebug (task sama seperti dulu di build.yml) varian debug.
#  - upload-artifact@v4 (contoh memakai `actions/allowed-actions/upload-artifact`, yang tidak ada).
#  - Pemicu: push `main` + manual (selaras build.yml); `cache-read-only`: cache Gradle hanya ditulis build.yml.

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: android-artifact-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  report:
    # Batch 650 — `ubuntu-latest` sedang dimigrasi GitHub ke Ubuntu 26.04 (19 Okt - 19 Nov 2026; notice di ringkasan run).
    # Dipasang eksplisit ke 24.04 = image SAMA seperti sebelumnya (SDK/JDK/alat tak berubah); pindah ke 26.04 nanti
    # keputusan sendiri, setelah diuji.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.14.4
          cache-read-only: true

      # 1. Tiga invocation Gradle TERPISAH (kegagalan satu tak menjatuhkan yang lain). Exit code disimpan ke
      #    berkas; langkah ini SELALU sukses.
      - name: ArchUnit + tes unit + SpotBugs + detekt/lint (NON-BLOCKING)
        id: analysis
        continue-on-error: true
        timeout-minutes: 35
        env:
          SONIX_ARCH_REPORT: "1"
        run: |
          set +e
          gradle testReleaseUnitTest --tests "com.rudi.audioplayer.ArchitectureTest" --no-daemon --no-build-cache > gradle-arch.log 2>&1
          echo "ARCH_EXIT=$?" > gradle-exit.txt
          gradle testReleaseUnitTest --continue --no-daemon --no-build-cache > gradle-tests.log 2>&1
          echo "TESTS_EXIT=$?" >> gradle-exit.txt
          gradle spotbugsRelease -Psonix.spotbugs=true --no-daemon --build-cache > gradle-spotbugs.log 2>&1
          echo "SPOTBUGS_EXIT=$?" >> gradle-exit.txt
          gradle detekt lintDebug --continue --no-daemon --no-build-cache > gradle-static.log 2>&1
          echo "STATIC_EXIT=$?" >> gradle-exit.txt
          cat gradle-exit.txt
          exit 0

      # 2. Rakit laporan ringkas. Status tiap alat HANYA dari berkas laporan yang benar-benar ada.
      - name: Create Compact Report for Claude
        id: report
        if: always()
        run: |
          set +e
          ARCH=app/build/reports/archunit/archunit-report.txt
          SARIF=app/build/reports/spotbugs/spotbugs.sarif
          DET_XML=app/build/reports/detekt/detekt.xml
          LINT_XML=app/build/reports/lint-results-debug.xml
          LINT_TXT=app/build/reports/lint-results-debug.txt
          ARCH_EXIT=$(sed -n 's/^ARCH_EXIT=//p' gradle-exit.txt 2>/dev/null | head -n 1)
          SPOTBUGS_EXIT=$(sed -n 's/^SPOTBUGS_EXIT=//p' gradle-exit.txt 2>/dev/null | head -n 1)
          STATIC_EXIT=$(sed -n 's/^STATIC_EXIT=//p' gradle-exit.txt 2>/dev/null | head -n 1)
          TESTS_EXIT=$(sed -n 's/^TESTS_EXIT=//p' gradle-exit.txt 2>/dev/null | head -n 1)
          TESTS_EXIT=${TESTS_EXIT:-n/a}
          ARCH_EXIT=${ARCH_EXIT:-n/a}
          SPOTBUGS_EXIT=${SPOTBUGS_EXIT:-n/a}
          STATIC_EXIT=${STATIC_EXIT:-n/a}
          : > report-arch.tmp
          : > report-sarif.tmp
          : > report-static.tmp
          : > report-tests.tmp

          # Kutipan akar masalah dari log Gradle (tanpa baris stack frame): blok FAILURE/"What went wrong",
          # baris kompilasi `e:`, task FAILED, lalu ekor log.
          excerpt() {
            [ -f "$1" ] || { echo "(log $1 tidak ada)"; return; }
            echo "-- AKAR MASALAH (kutipan $1) --"
            sed -n '/^FAILURE:/,/^\* Try:/p' "$1" | grep -v -E '^\s+at ' | head -n 60
            grep -E '^e: |^> Task .* FAILED|Script compilation error|Could not resolve|Unresolved reference' "$1" | head -n 30
            echo "-- EKOR LOG $1 (40 baris terakhir, tanpa stack frame) --"
            grep -v -E '^\s+at ' "$1" | tail -n 40
          }

          # --- ArchUnit (baris [PASS] dibuang: hanya header + pelanggaran) ---
          NEED_ARCH_LOG=0
          if [ -s "$ARCH" ]; then
            A_STATUS=$(sed -n 's/^ARCHUNIT_STATUS=//p' "$ARCH" | head -n 1)
            if [ "$A_STATUS" = "OK" ]; then
              A_VIOL=$(sed -n 's/^VIOLATIONS=//p' "$ARCH" | head -n 1)
              A_RULES=$(sed -n 's/^RULES=//p' "$ARCH" | head -n 1)
              if [ "$A_VIOL" = "0" ]; then
                ARCH_SUMMARY="ArchUnit: LULUS (${A_RULES:-?} aturan, 0 pelanggaran)"
              else
                ARCH_SUMMARY="ArchUnit: ${A_VIOL:-?} PELANGGARAN"
              fi
            else
              ARCH_SUMMARY="ArchUnit: NOT VERIFIED (alat gagal jalan)"
              NEED_ARCH_LOG=1
            fi
            grep -v '^\[PASS\] ' "$ARCH" > report-arch.tmp
          else
            ARCH_SUMMARY="ArchUnit: NOT VERIFIED (laporan tidak terbentuk: tes dilewati/gagal; lihat kutipan log)"
            echo "Berkas $ARCH tidak ada." > report-arch.tmp
            NEED_ARCH_LOG=1
          fi
          if [ "$NEED_ARCH_LOG" = "1" ] || [ "$ARCH_EXIT" != "0" ]; then
            { echo ""; excerpt gradle-arch.log; } >> report-arch.tmp
          fi

          # --- SpotBugs (SARIF): 1 baris per titik, duplikat digabung "xN" ---
          NEED_SB_LOG=0
          if [ -s "$SARIF" ] && jq -e '.runs' "$SARIF" > /dev/null 2>&1 && S_COUNT=$(jq '[.runs[].results[]?] | length' "$SARIF" 2>/dev/null) && [ -n "$S_COUNT" ]; then
            if [ "$S_COUNT" = "0" ]; then
              SARIF_SUMMARY="SpotBugs: LULUS (0 temuan)"
            else
              SARIF_SUMMARY="SpotBugs: $S_COUNT temuan"
            fi
            {
              if [ "$S_COUNT" -gt 0 ]; then
                echo "Per aturan (terbanyak dulu):"
                jq -r '[.runs[].results[]?] | group_by(.ruleId) | map({r: .[0].ruleId, n: length}) | sort_by(-.n)[] | "  \(.n)x \(.r)"' "$SARIF" 2>/dev/null | head -n 40
                echo ""
                echo "Titik temuan (noise Kotlin disaring di config/spotbugs/exclude.xml; maks 120):"
                jq -r '[.runs[].results[]?] | map({k: "\(.ruleId) @ \(.locations[0].physicalLocation.artifactLocation.uri // "?"):\(.locations[0].physicalLocation.region.startLine // 0)"}) | group_by(.k) | map("- \(.[0].k)" + (if length > 1 then " x\(length)" else "" end)) | .[:120][]' "$SARIF" 2>/dev/null
              fi
            } > report-sarif.tmp
          else
            SARIF_SUMMARY="SpotBugs: NOT VERIFIED (SARIF tidak terbentuk / tidak valid / jq gagal; lihat kutipan log)"
            echo "Berkas $SARIF tidak ada atau tidak bisa dibaca." > report-sarif.tmp
            NEED_SB_LOG=1
          fi
          if [ "$NEED_SB_LOG" = "1" ] || [ "$SPOTBUGS_EXIT" != "0" ]; then
            { echo ""; excerpt gradle-spotbugs.log; } >> report-sarif.tmp
          fi

          # --- detekt + lintDebug (dipindah dari build.yml, Batch 575): diurai hanya bila ada temuan ---
          NEED_STATIC_LOG=0
          if [ -f "$DET_XML" ]; then
            DET=$(grep -c '<error ' "$DET_XML" 2>/dev/null)
            DET=${DET:-0}
            if [ "$DET" = "0" ]; then
              DET_SUMMARY="detekt: LULUS (0 temuan)"
            else
              DET_SUMMARY="detekt: $DET temuan"
              {
                echo "detekt (maks 60):"
                awk '/<file name=/ { match($0, /name="[^"]*"/); f = substr($0, RSTART + 6, RLENGTH - 7); sub(/.*\/com\/rudi\/audioplayer\//, "", f) } /<error / { match($0, /line="[0-9]+"/); l = substr($0, RSTART + 6, RLENGTH - 7); match($0, /source="[^"]*"/); s = substr($0, RSTART + 8, RLENGTH - 9); print "- " s " @ " f ":" l }' "$DET_XML" | head -n 60
              } >> report-static.tmp
            fi
          else
            DET_SUMMARY="detekt: NOT VERIFIED (detekt.xml tidak terbentuk; lihat kutipan log)"
            echo "Berkas $DET_XML tidak ada." >> report-static.tmp
            NEED_STATIC_LOG=1
          fi
          if [ -f "$LINT_XML" ]; then
            LNT=$(grep -c '<issue ' "$LINT_XML" 2>/dev/null)
            LNE=$(grep -c 'severity="Error"\|severity="Fatal"' "$LINT_XML" 2>/dev/null)
            LNW=$(grep -c 'severity="Warning"' "$LINT_XML" 2>/dev/null)
            LNT=${LNT:-0}
            LNE=${LNE:-0}
            LNW=${LNW:-0}
            if [ "$LNT" = "0" ]; then
              LINT_SUMMARY="lintDebug: LULUS (0 isu)"
            else
              LINT_SUMMARY="lintDebug: $LNT isu ($LNE error, $LNW warning)"
              {
                echo "lintDebug (maks 60 baris):"
                head -n 60 "$LINT_TXT" 2>/dev/null
              } >> report-static.tmp
            fi
          else
            LINT_SUMMARY="lintDebug: NOT VERIFIED (lint-results-debug.xml tidak terbentuk; lihat kutipan log)"
            echo "Berkas $LINT_XML tidak ada." >> report-static.tmp
            NEED_STATIC_LOG=1
          fi
          if [ "$NEED_STATIC_LOG" = "1" ] || [ "$STATIC_EXIT" != "0" ]; then
            { echo ""; excerpt gradle-static.log; } >> report-static.tmp
          fi

          # --- Tes unit (Batch 645): jumlah dari XML hasil tes (`<testsuite tests= skipped= failures= errors=>`). Tanpa XML = NOT VERIFIED ---
          TEST_DIR=app/build/test-results/testReleaseUnitTest
          sum_attr() { grep -h -o '<testsuite [^>]*>' "$TEST_DIR"/*.xml 2>/dev/null | grep -o " $1=\"[0-9]*\"" | grep -o '[0-9]*' | awk '{s+=$1} END{print s+0}'; }
          if ls "$TEST_DIR"/*.xml > /dev/null 2>&1; then
            T_ALL=$(sum_attr tests)
            T_SKIP=$(sum_attr skipped)
            T_FAIL=$(sum_attr failures)
            T_ERR=$(sum_attr errors)
            T_BAD=$((T_FAIL + T_ERR))
            if [ "$T_BAD" = "0" ] && [ "$T_ALL" -gt 0 ]; then
              TESTS_SUMMARY="Tes unit: LULUS ($T_ALL tes, $T_SKIP dilewati)"
            elif [ "$T_BAD" = "0" ]; then
              TESTS_SUMMARY="Tes unit: NOT VERIFIED (0 tes terbaca dari XML)"
              { echo ""; excerpt gradle-tests.log; } >> report-tests.tmp
            else
              TESTS_SUMMARY="Tes unit: $T_BAD GAGAL (dari $T_ALL tes, $T_SKIP dilewati)"
              {
                echo "Tes gagal (maks 40):"
                awk '/<testcase /{match($0,/classname="[^"]*"/);c=substr($0,RSTART+11,RLENGTH-12);match($0,/ name="[^"]*"/);n=substr($0,RSTART+7,RLENGTH-8)} /<(failure|error) /{m="";if(match($0,/message="[^"]*"/)){m=substr($0,RSTART+9,RLENGTH-10)};print "- " c "." n ": " substr(m,1,160)}' "$TEST_DIR"/*.xml | head -n 40
              } >> report-tests.tmp
            fi
          else
            TESTS_SUMMARY="Tes unit: NOT VERIFIED (hasil tes tidak terbentuk: kompilasi tes / Gradle gagal; lihat kutipan log)"
            { echo ""; excerpt gradle-tests.log; } >> report-tests.tmp
          fi

          # --- Peringatan kompilator Kotlin (Batch 576): baris `w: file://...`, tanpa kode tes, dedupe ---
          : > report-kwarn.tmp
          if grep -q -E '^> Task :app:compile(Release|Debug)Kotlin$' gradle-arch.log gradle-static.log 2>/dev/null; then
            grep -h '^w: file://' gradle-arch.log gradle-static.log 2>/dev/null | grep -v -E '/src/(test|androidTest)/' | sed -E 's#^w: file://.*/com/rudi/audioplayer/#w: #' | cut -c1-140 | sort -u > kwarn.list
            KW=$(wc -l < kwarn.list | tr -d ' ')
            KW=${KW:-0}
            if [ "$KW" = "0" ]; then
              KWARN_SUMMARY="Peringatan kompilator Kotlin: LULUS (0)"
            else
              KWD=$(grep -c 'deprecated' kwarn.list)
              KWD=${KWD:-0}
              KWARN_SUMMARY="Peringatan kompilator Kotlin: $KW ($KWD deprecated, $((KW - KWD)) lainnya)"
              {
                if [ "$((KW - KWD))" -gt 0 ]; then
                  echo "Selain deprecated (maks 40):"
                  grep -v 'deprecated' kwarn.list | head -n 40
                fi
                if [ "$KWD" -gt 0 ]; then
                  echo "Deprecated (maks 40):"
                  grep 'deprecated' kwarn.list | head -n 40
                fi
              } > report-kwarn.tmp
            fi
          else
            KWARN_SUMMARY="Peringatan kompilator Kotlin: NOT VERIFIED (tak ada tugas kompilasi Kotlin yang dieksekusi / log tidak ada)"
            echo "Tak ada baris '> Task :app:compile(Release|Debug)Kotlin' yang dieksekusi di gradle-arch.log / gradle-static.log." > report-kwarn.tmp
          fi

          {
            echo "=== LAPORAN EVALUASI UNTUK CLAUDE ==="
            echo "Proyek: ${{ github.event.repository.name }} · Commit: ${{ github.sha }} · Run: #${{ github.run_number }} · Cabang: ${{ github.ref_name }}"
            echo "Dibuat (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Gradle exit: ArchUnit=$ARCH_EXIT · Tes=$TESTS_EXIT · SpotBugs=$SPOTBUGS_EXIT · detekt+lintDebug=$STATIC_EXIT"
            echo ""
            echo "--- RINGKASAN ---"
            echo "$ARCH_SUMMARY"
            echo "$SARIF_SUMMARY"
            echo "$DET_SUMMARY"
            echo "$LINT_SUMMARY"
            echo "$TESTS_SUMMARY"
            echo "$KWARN_SUMMARY"
            echo "Catatan: NOT VERIFIED = alat tidak jalan / laporan tidak ada; BUKAN berarti bersih."
            if [ "$A_VIOL" != "0" ] || [ "$NEED_ARCH_LOG" = "1" ] || [ "$ARCH_EXIT" != "0" ]; then
              echo ""
              echo "--- ARSITEKTUR (ARCHUNIT) ---"
              cat report-arch.tmp
            fi
            if [ -s report-sarif.tmp ]; then
              echo ""
              echo "--- KUALITAS KODE (SPOTBUGS · SARIF) ---"
              cat report-sarif.tmp
            fi
            if [ -s report-static.tmp ]; then
              echo ""
              echo "--- STATIC ANALYSIS (DETEKT · LINT) ---"
              cat report-static.tmp
            fi
            if [ -s report-tests.tmp ]; then
              echo ""
              echo "--- TES UNIT ---"
              cat report-tests.tmp
            fi
            if [ -s report-kwarn.tmp ]; then
              echo ""
              echo "--- PERINGATAN KOMPILATOR KOTLIN ---"
              cat report-kwarn.tmp
            fi
          } > laporan-untuk-claude.txt

          echo "::notice::$ARCH_SUMMARY · $SARIF_SUMMARY · $DET_SUMMARY · $LINT_SUMMARY · $TESTS_SUMMARY · $KWARN_SUMMARY"
          {
            echo "### 🔎 Laporan untuk Claude (non-blocking)"
            echo ""
            echo "- $ARCH_SUMMARY"
            echo "- $SARIF_SUMMARY"
            echo "- $DET_SUMMARY"
            echo "- $LINT_SUMMARY"
            echo "- $TESTS_SUMMARY"
            echo "- $KWARN_SUMMARY"
            echo "- Artifact: \`SONIX_laporan-untuk-claude_run${{ github.run_number }}\`"
          } > banner.md
          cat laporan-untuk-claude.txt

      # 2b. Banner ringkasan run (Batch 645): selalu tampil. `banner.md` dari langkah rakit; bila tak ada (langkah rakit gagal di
      #     tengah / dibatalkan) -> banner cadangan NOT VERIFIED (gagal != lulus).
      - name: Publish report summary (banner)
        if: always()
        run: |
          if [ -s banner.md ]; then
            cat banner.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### 🔎 Laporan untuk Claude (non-blocking)"
              echo ""
              echo "- NOT VERIFIED: banner tidak terbentuk (analisis: ${{ steps.analysis.outcome }}, rakit laporan: ${{ steps.report.outcome }})"
              echo "- Artifact: \`SONIX_laporan-untuk-claude_run${{ github.run_number }}\` (mungkin tidak terbentuk)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # 3. Artifact resmi GitHub (berkas tunggal .txt; mudah diunduh di HP lalu diunggah ke Claude).
      - name: Upload Report for Claude
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: SONIX_laporan-untuk-claude_run${{ github.run_number }}
          path: laporan-untuk-claude.txt
          retention-days: 14
          if-no-files-found: warn
