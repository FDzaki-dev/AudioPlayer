// Compose compiler stability configuration.
//
// android.net.Uri is a platform type the Compose compiler can't inspect, so any
// @Composable parameter or data class field of this type (e.g. Song.uri) is
// conservatively treated as unstable -- which disables equals-based recomposition
// skipping for that whole type. Uri itself is effectively immutable (its public API
// has no setters), so it's safe to mark stable here.
//
// Added in Batch 20 while investigating excessive recomposition in LibraryScreen's
// song lists: Song (data class) carries a Uri field, so every SongRow was unable to
// skip recomposition even when nothing about the song actually changed.
//
// Batch 21: comment lines originally used "#" -- the parser for this file only
// recognizes "//" as a comment marker (confirmed against Google's own reference
// usage in android/nowinandroid's compose_compiler_config.conf), so the "#" lines
// were read as literal (invalid) patterns and broke the release build.
android.net.Uri

// kotlin.collections.List: the List<Song> stability candidate blocked since Batch 392
// ("stabilitas List<Song> app-wide -- perlu ubah signature Composable lintas banyak
// file, melampaui batas 3-file/task") assumed the only fix was converting every
// List<Song> Composable parameter app-wide (10+ files in ui/) to
// kotlinx.collections.immutable.ImmutableList<Song>. Batch 413: same escape hatch as
// android.net.Uri above applies here instead -- kotlin.collections.List is an
// interface (could be backed by a mutable ArrayList), so the Compose compiler always
// marks it unstable regardless of the element type, even though Song itself is
// already fully stable (all fields stable, Uri included per the entry above). This
// is Google's own documented alternative to the ImmutableList conversion, for
// codebases that don't mutate a List in place after it's been handed to
// composition: https://developer.android.com/develop/ui/compose/performance/stability/fix
//
// Verified before adding (Batch 413), so the stability contract this entry implies
// actually holds app-wide, not just for Song:
// - 0 usages of mutableStateListOf(..) anywhere in app/src/main.
// - The only 2 mutableListOf<Song>()/MutableList<Song> sites (MusicRepository
//   .querySongs(), CustomFolderScanner.scan()/collect()) are function-local
//   accumulators returned once as a finished List -- never mutated again after
//   being handed off.
// - Queue reordering (PlayerViewModel.moveQueueItem/removeFromQueue), the one place
//   in the app that edits an in-flight song list, always calls
//   currentQueue.toMutableList().apply { ... } and reassigns the result -- a fresh
//   copy, never an in-place mutation of the List instance already published to
//   _uiState/Compose.
// Net effect: every List<Song> (and List<T> generally) reaching a Composable in this
// app is a fresh instance per change, so trusting equals()-based skipping here does
// not risk stale UI. Scoped to kotlin.collections.List only (not Set/Map) --
// narrower than the Batch 392 candidate needed, no other collection type was part of
// that request.
kotlin.collections.List
